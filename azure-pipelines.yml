# Lab 3 - CI only. Replace with solutions/azure-pipelines-full.yml in Lab 5.
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest      # self-hosted agent? replace with:  name: Default

variables:
  pythonVersion: '3.11'

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Test
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install -r requirements.txt
            displayName: Install dependencies

          - script: flake8 src tests --max-line-length 100
            displayName: Lint code

          - script: python -m pytest -v --junitxml=test-results.xml
            displayName: Run unit tests

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: test-results.xml
              testRunTitle: RetailFlow unit tests

          - script: python -m src.clean_sales
            displayName: Run pipeline on sample data

          - publish: output
            artifact: curated-data
            displayName: Publish cleaned data
